<style>
:root{color-scheme:dark;--bg:#121316;--panel:#191b20;--card:#20232a;--line:#343945;--muted:#abb3c2;--text:#eeeef2;--blue:#99bdff;--purple:#b6a3ff;--green:#a6dfbb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,select,textarea,input{font:inherit;color:inherit}button,select{background:#242831;border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:#b6cdff;color:#101b33;border-color:#b6cdff}button.small{font-size:12px;padding:3px 7px}button.on{background:#30394c;color:#c0d5ff}a{color:var(--blue)}p{margin:8px 0 14px}h1{font-size:25px;margin:12px 0}h2{font-size:20px}h3{font-size:16px}small,.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{padding:8px 16px;border-bottom:1px solid var(--line)}.banner{padding:8px 16px;background:#262333;font-size:12px;color:#d7c9ff;display:flex;justify-content:space-between;gap:12px}.layout{display:grid;grid-template-columns:58px 208px minmax(350px,1fr) 420px;height:calc(100vh - 87px);min-height:650px}.rail{padding:14px 7px;border-right:1px solid var(--line)}.rail button{width:43px;margin-bottom:12px;padding:7px 3px;font-size:12px;background:transparent}.directory{padding:14px 12px;border-right:1px solid var(--line);overflow:auto;resize:horizontal;min-width:170px}.directory button.stage{display:block;width:100%;text-align:left;border-color:transparent;background:transparent;margin:3px 0}.directory button.stage.on{background:#2c303a}.directory .minor{padding:14px 8px 5px;color:var(--muted);font-size:12px}.document{padding:0 20px 25px;overflow:auto;min-width:0}.tools{padding:12px 0;border-bottom:1px solid var(--line)}.status{border:1px solid #446851;background:#1b2b24;padding:10px 12px;margin:14px 0;border-radius:8px}.status .badge{color:var(--green);font-size:11px;margin-right:8px}.doc-body{max-width:1000px;margin:0 auto}.scene{background:#1b1d23;border:1px solid var(--line);border-radius:9px;padding:23px;margin:18px 0;font-size:17px;line-height:2}.scene h2{line-height:1.5;font-size:18px;margin:0 0 12px}.scene.highlight{outline:2px solid var(--purple)}.scene p{margin-bottom:14px}.scene details{font-size:13px;color:var(--muted)}summary{cursor:pointer}.assistant{display:flex;flex-direction:column;min-width:0;background:#181a20;border-left:1px solid var(--line)}.assistant .head{padding:13px;border-bottom:1px solid var(--line)}.messages{flex:1;overflow:auto;padding:14px;min-height:100px}.message{margin-bottom:16px;padding:13px;border-radius:9px;background:#22252d}.message.user{margin-left:40px;background:#213d64}.message.choice{border-left:3px solid var(--purple)}.message.progress{border-left:3px solid #83bfc9}.message p{margin:7px 0}.composer{padding:13px;border-top:1px solid var(--line);background:#1c1f25}.composer textarea{width:100%;height:100px;resize:vertical;background:#13161c;border:1px solid #485162;border-radius:8px;padding:10px}.model{font-size:11px;text-align:left;max-width:145px}.model b{display:block;font-size:12px}.chip{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:5px}.preview{display:none;padding:20px;background:#191c22;border-left:1px solid var(--line);overflow:auto}.layout.focus{grid-template-columns:58px 208px minmax(480px,1fr)}.layout.focus .document{display:none}.layout.focus .assistant{max-width:900px;width:100%;margin:auto;height:100%;border-right:1px solid var(--line)}.layout.focus.with-preview{grid-template-columns:58px 208px minmax(350px,1fr) minmax(350px,1fr)}.layout.focus.with-preview .preview{display:block}.hidden{display:none!important}.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.asset{border:1px solid var(--line);padding:16px;border-radius:10px;background:#1c1f25}.image{height:150px;display:grid;place-items:center;border:1px dashed #74817a;border-radius:7px;background:linear-gradient(140deg,#495e51,#736449);color:#f6f3dd}.issue{padding:16px;border:1px solid #735b83;border-radius:10px;margin:18px 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:15px}.compare>div{padding:16px;border:1px solid var(--line);border-radius:8px}.changed{color:#c2e7bb}dialog{color:var(--text);background:#1b1e25;border:1px solid #505869;border-radius:14px;width:min(720px,94vw);max-height:85vh;padding:24px}dialog::backdrop{background:#0009}dialog label{display:block;margin:14px 0}dialog select,dialog input{width:100%;padding:8px;background:#252a34;border:1px solid #4a5161;border-radius:6px}dialog .checks input{width:auto;margin-right:10px}.refs{padding:12px;border:1px solid var(--line);border-radius:8px;margin:12px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#c1d7ff;color:#12213b;padding:12px 20px;border-radius:8px;z-index:20}button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue)}@media(max-width:1050px){.layout{grid-template-columns:48px 170px minmax(300px,1fr) 330px}.layout.focus{grid-template-columns:48px 170px 1fr}.layout.focus.with-preview{grid-template-columns:48px 150px 1fr}.layout.focus.with-preview .preview{grid-column:3;height:350px}.layout.focus.with-preview .assistant{height:480px}.asset-grid{grid-template-columns:1fr}}@media(max-width:780px){.layout,.layout.focus,.layout.focus.with-preview{display:flex;flex-direction:column;height:auto}.rail{display:none}.directory{display:flex;gap:5px;overflow:auto;resize:none}.directory>*{flex-shrink:0}.directory .minor,.directory .mode{display:none}.directory button.stage{width:auto}.document{max-height:none}.assistant{min-height:500px}.layout.focus.with-preview .assistant{height:550px}.banner{flex-wrap:wrap}.compare{grid-template-columns:1fr}}

<div class="banner"><span>局部改造设计 · 保留现有界面和已修正体验 · 绿色条为新增交互</span><span>预设演示，不连接真实服务　<a href="../docs/保留现有界面的AI协作改造设计_20261111.md">保留清单与设计说明 ↗</a></span></div>
<div class="tabs spread"><div class="row"><button class="on" onclick="toast('当前示例项目：PUGGY ROOM。正式产品沿用多项目标签和原集定位。')">PUGGY ROOM　×</button><button onclick="openPanel('projects')">＋ 打开项目</button></div><button onclick="openPanel('logs')">执行日志</button></div>
<div class="layout" id="layout"><aside class="rail"><button onclick="openPanel('home')">创作</button><button onclick="openPanel('projects')">项目</button><button onclick="stageTo(6)">资产</button><button onclick="openPanel('knowledge')">知识库</button><button onclick="openPanel('style')">风格</button><button onclick="openPanel('division')">设置</button></aside><nav class="directory" id="directory"></nav>
<section class="document"><div class="tools row"><button onclick="focusChat()">创作对话</button><button onclick="openPanel('references')">本步需求与参考</button><button class="on" onclick="toast('当前为成果文档模式，阅读与选区能力保留。')">成果文档</button><button onclick="openPanel('check')">过关清单</button></div><div class="tools spread"><div class="row"><button onclick="openPanel('decisions')">导演决定</button><button onclick="openPanel('methods')">制作方法</button><span>E04 · 纸箱怪兽</span></div><div class="row"><span class="chip">独立成集</span><span class="chip">9:16</span><button onclick="openPanel('division')">执行与分工</button></div></div>
<div class="status spread"><span><span class="badge">新增</span><span id="statusText">已就绪 · 可以让 AI 按当前配置继续制作</span></span><button id="workButton" onclick="toggleWork()">让 AI 继续制作</button></div><div class="doc-body" id="doc"></div></section>
<aside class="assistant"><div class="head spread"><strong>导演助手</strong><div class="row"><button id="focusButton" onclick="focusChat()">专注对话</button><button onclick="openPanel('more')">更多工具</button><button id="previewButton" class="hidden" onclick="togglePreview()">成果预览</button></div></div><div class="messages" id="messages"><div class="message user">保留怪兽装和大鱼尾巴，把两猫配合写得更清楚。</div><div class="message"><small>创作模型 · 示例回执</small><p>我会把 LEO 停车接应写成可见动作，保留你选定的故事和角色。</p><button class="small" onclick="recordDecision()">记为决定</button></div><div class="message choice"><strong>继续按现有配置制作</strong><p>AI 完成专业判断、审查修订和下游更新。你可以继续看稿、换模型、加参考或随时提出意见。</p><button class="primary" onclick="toggleWork()">让 AI 继续制作</button> <button onclick="openPanel('division')">查看分工</button></div></div>
<div class="composer"><div id="context" class="muted"></div><textarea id="draft" aria-label="对话输入" placeholder="讨论、提出修改，或让 AI 继续制作…"></textarea><div class="spread" style="margin-top:8px"><button aria-label="添加附件" onclick="document.querySelector('#file').click()">＋</button><input type="file" id="file" class="hidden" multiple onchange="filesChanged()"><div class="row"><button class="model" id="createModel" onclick="openPanel('create')"></button><button class="model" id="reviewModel" onclick="openPanel('review')"></button><button class="primary" aria-label="发送消息" onclick="send()">↑</button></div></div><div class="row" style="margin-top:7px"><button class="small" onclick="openPanel('division')">模型分工</button><button class="small" onclick="openPanel('references')">已选参考 <span id="refCount">2</span></button><small>⌘ / Ctrl + 回车发送</small></div></div></aside><aside class="preview" id="preview"></aside></div>
<dialog id="modal"><div class="spread"><h2 id="modalTitle"></h2><button onclick="document.querySelector('#modal').close()">关闭</button></div><div id="modalBody"></div></dialog>
<script>
const stages=['01 故事方向','02 角色','03 世界规则','04 分场','05 剧本','06 故事审查','07 素材','08 表演','09 镜头与提示词'];let stage=4,working=false,started=false,focus=false,preview=false,comparison=false,version=4,refs=['项目暖阳色卡','知识库原文片段'],decision=false;
const choices={create:{provider:'Antigravity',model:'gemini-3.8-flash-medium',effort:'执行器默认'},review:{provider:'Codex',model:'gpt-6-astra',effort:'medium'}};
const catalogs={Codex:['gpt-6-astra'],Claude:['执行器默认'],Antigravity:['gemini-3.8-flash-medium']};
const $=s=>document.querySelector(s),escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3500)}
function message(s,type='progress'){const e=document.createElement('div');e.className='message '+type;e.textContent=s;$('#messages').append(e);e.scrollIntoView({block:'nearest'})}
function nav(){ $('#directory').innerHTML='<div class="mode"><b>目录</b><p>合作档位 <select aria-label="合作档位" onchange="toast(\'档位保留；各档位均能使用 AI 连续工作。\')"><option>新手</option><option selected>进阶</option><option>高手</option></select></p></div>'+stages.map((s,i)=>`<button class="stage ${i===stage?'on':''}" onclick="stageTo(${i})">${s}</button>`).join('')+'<div class="minor">交付</div>'+['独审','交付核验','H3 出包','发布文案'].map(s=>`<button class="stage" onclick="openPanel('delivery')">${s}</button>`).join('');}
function stageTo(i){stage=i;comparison=false;nav();doc();if(preview)renderPreview()}
function storyBody(){return `<article class="scene" id="scene"><h2>3. 外景 · 手作展示区 · 日</h2><p>MILO 的纸爪卡在桌腿之间。他缩回左爪，把纸筒取下来。LEO 回头看见，主动把小车退回来，在他身边停稳。</p><p>MILO 把纸筒横搭到车顶，退后一步，得意地指向这个新车篷。LEO 抬头看看，转动车轮，载着它向展示台驶去。两猫的追逐变成了一场配合默契的展示。</p><h3>对白</h3><p>工作人员<br>Great teamwork!</p><details><summary>表演、声音与制作说明</summary><p>LEO 的停车、回望和等待形成可见的接应。纸板摩擦声和围观者笑声保留。</p></details><button class="small" onclick="$('#context').textContent='选区：第 3 场 · LEO 主动停车接应';$('#draft').focus()">以这段为修改范围</button></article>`}
function doc(){let h=`<details class="tools"><summary>本步用了什么 · 上游采用稿、项目设定、风格与原文参考</summary><p>沿用实际输入摘要与来源查看能力。此示意未读取 E04 真实运行材料。</p><button onclick="openPanel('references')">查看本步引用</button></details><h1>${stages[stage]}</h1><div class="row"><button onclick="version=3;doc()">R03</button><button class="on" onclick="version=4;doc()">R04</button><span class="muted">当前查看 R0${version} · 示例</span><button onclick="comparison=!comparison;doc()">比较版本</button><button onclick="openPanel('source')">版本来源</button></div>`;
if(stage===6)h+=`<div class="tools row">${['素材清单','备图工作单','按镜头补图','全部图片','生成画布'].map(s=>`<button onclick="toast('${s}入口保留，正式实现继续使用原组件。')">${s}</button>`).join('')}</div><div class="status spread"><span><span class="badge">新增</span>按现有清单和通道自动准备、评估和选图</span><button onclick="message('备图演示：先复用身份图，再按依赖生成场景和状态图；关键视觉候选仍在原条目中选择。');toast('已演示 AI 接手续图，不会发送真实请求。')">让 AI 完成本集备图</button></div><div class="row">出图通道<select aria-label="出图通道"><option>Codex 原生</option><option>OpenAI Image MCP</option></select>尺寸<select><option>1536×864</option><option>864×1536</option></select><button onclick="toast('保留已有批量批准能力，不增加费用确认。')">批量批准</button></div><div class="asset-grid">${['MILO 固定身份','手作游园空景','巨型布鱼基准','纸箱怪兽状态'].map((s,i)=>`<article class="asset"><div class="image" onclick="openPanel('image')">${s} · 图像占位</div><h3>${s}</h3><p>${i===0?'沿用项目固定身份':'候选与 AI 推荐保留在原条目'}</p><details><summary>用途、场次、来源和提示词</summary><p>显示本集使用场次和实际来源；技术字段继续折叠。</p></details><div class="row"><button onclick="openPanel('image')">查看原图</button><button onclick="toast('可主动换图或局部改图，入口不移除。')">换一张或重出</button></div></article>`).join('')}</div>`;
else if(stage===5)h+=`<div class="issue"><b>故事审查 · AI 正在处理</b><p>第 3 场中，LEO 从躲避追逐变成主动配合，需要一个看得见的接应动作。</p><button onmouseenter="$('#scene')?.classList.add('highlight')" onmouseleave="$('#scene')?.classList.remove('highlight')" onclick="$('#scene').scrollIntoView({block:'center'});$('#scene').classList.add('highlight')">定位正文</button><details><summary>审查依据、原句和返修记录</summary><p>保留原有证据和版本定位。AI 将接应写进剧本并更新相关分镜，不要求用户建立返修单。</p><button onclick="message('AI 已按整轮意见生成修改计划，正在执行对应阶段。')">整轮修订</button><button onclick="message('已限定本条问题的修改范围。')">仅修订这条</button></details><div class="status"><span class="badge">新增</span>AI 已形成改法：让 LEO 回头、倒车接应、停稳等待。</div></div>`+storyBody();
else if(comparison)h+=`<div class="compare" style="margin-top:20px"><div><h3>R03 · 第 3 场</h3><p>MILO 把纸筒搭在经过的小车上，LEO 带着它驶向展示台。</p></div><div><h3>R04 · 第 3 场</h3><p class="changed">LEO 回头看见，主动把小车退回来，在 MILO 身边停稳。</p><p>MILO 再把纸筒搭到车顶。</p></div></div>`;
else if(stage===4)h+=storyBody();else h+=`<article class="scene"><h2>${stages[stage]}成果区域保留</h2><p>正式产品直接沿用本阶段已有文档组件、阅读排版、版本与编辑能力。此设计重点展示局部交互，不伪造尚未展开的完整页面。</p><p>可点击 05 剧本、06 故事审查和 07 素材查看本版重点设计。</p></article>`;
h+=`<div class="row"><button onclick="$('#draft').value='修改这段，让动作更简洁';$('#draft').focus()">修改本阶段</button><button onclick="toast('单步采用能力保留；自动工作中不要求每步人工签收。')">采用并继续</button><button onclick="openPanel('check')">查看过关清单</button></div>`;$('#doc').innerHTML=h}
function updateModels(){for(const r of ['create','review'])$('#'+r+'Model').innerHTML=(r==='create'?'创作':'独审')+`<b>${escape(choices[r].provider)} · ${escape(choices[r].model)} ⌄</b>`}
function toggleWork(){started=true;working=!working;$('#statusText').textContent=working?'AI 正在修订剧本；之后准备素材 · 使用当前执行分工':'已暂停 · 完成的成果保留';$('#workButton').textContent=working?'暂停':'继续';message(working?'执行演示：读取已选模型、风格和知识库引用，接续修订与制作。当前阅读位置保持不变。':'执行演示：已暂停，当前稿件、对话与配置保留。')}
function focusChat(){focus=!focus;if(!focus)preview=false;$('#layout').className='layout'+(focus?' focus':'')+(preview?' with-preview':'');$('#focusButton').textContent=focus?'返回成果文档':'专注对话';$('#previewButton').classList.toggle('hidden',!focus)}
function togglePreview(){preview=!preview;$('#layout').classList.toggle('with-preview',preview);if(preview)renderPreview()}
function renderPreview(){$('#preview').innerHTML=`<div class="spread"><b>成果预览 · ${stages[stage]}</b><button onclick="togglePreview()">关闭预览</button></div>`+storyBody().replace('id="scene"','id="previewScene"')}
function filesChanged(){$('#context').textContent='附件：'+Array.from($('#file').files).map(f=>f.name).join('、')+'（仅本地示意，不上传）'}
function recordDecision(){decision=true;toast('演示：原话已记为决定，范围可在原清单修改。')}
function send(){const t=$('#draft').value.trim();if(!t)return;message(t,'user');$('#draft').value='';message('此原型只演示交互，不对你的输入做真实语义处理。正式产品沿用对话/改稿自动识别，明确修改时写入新版本并同步相关成果。')}
$('#draft').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send()}});
function modelForm(role){const c=choices[role];return `<p>沿用输入框底部入口，选择后自动保存。此处为预设目录；正式产品加载已连接 CLI 的实际型号。</p><label>执行器<select aria-label="执行器" onchange="choices['${role}'].provider=this.value;choices['${role}'].model=catalogs[this.value][0];updateModels();$('#modalBody').innerHTML=modelForm('${role}');toast('示例选择已保存')">${Object.keys(catalogs).map(v=>`<option ${v===c.provider?'selected':''}>${v}</option>`).join('')}</select></label><label>型号<select aria-label="型号" onchange="choices['${role}'].model=this.value;updateModels();toast('示例选择已保存')">${catalogs[c.provider].map(v=>`<option>${v}</option>`).join('')}</select></label><label>推理强度<select aria-label="推理强度" onchange="choices['${role}'].effort=this.value;toast('示例选择已保存')">${['执行器默认','medium','high'].map(v=>`<option ${v===c.effort?'selected':''}>${v}</option>`).join('')}</select></label><small>新选择用于后续请求；已发起请求的记录保留原设置。可用强度由真实执行器能力决定。</small>`}
function openPanel(kind){let title='',body='';if(kind==='create'||kind==='review'){title=kind==='create'?'创作模型':'独审模型';body=modelForm(kind)}
else if(kind==='division'){title='执行与模型分工';body=`<p>用户选择保持生效。AI 在这套分工下自动工作。</p><div class="refs">创作：${choices.create.provider} / ${choices.create.model} / ${choices.create.effort}<br>独审：${choices.review.provider} / ${choices.review.model} / ${choices.review.effort}</div><label>协作方式<select><option>起草—独立审查—修订</option><option>并行出稿—择优</option><option>起草—指定模型修订</option></select></label><label>额度不足时<select><option>等待或由我选择其他模型</option><option>使用我配置的备用执行器</option></select></label><p class="muted">配置入口保留；此处仅演示选择，不保存到实际项目。正式实现沿用已有分工对象及按阶段覆盖。</p>`}
else if(kind==='references'){title='本步需求与参考';body=`<p>保留原有参考和方法入口；选中的内容进入 AI 工作输入。</p><div class="refs">${refs.map(escape).join('<br>')}</div><div class="row"><button onclick="openPanel('style')">选择风格与色卡</button><button onclick="openPanel('knowledge')">知识库原文</button><button onclick="openPanel('methods')">阶段方法</button></div><label>本步要求<input placeholder="可选：补充你想保留的东西"></label><small>当前任务要求随执行传递；长期决定仍可在原清单查看和调整。</small>`}
else if(kind==='style'){title='引用风格与色卡';body=`<p>项目风格、色卡与参考图保留。此处为示例色卡。</p><div class="asset-grid">${['项目暖阳色卡','柔和树荫参考'].map(s=>`<article class="asset"><div class="image">${s}</div><button style="margin-top:12px" onclick="addRef('${s}')">引用此风格</button></article>`).join('')}</div><p>正式产品继续提供原图、来源与适用说明，沿用既有选择上限。</p>`}
else if(kind==='knowledge'){title='知识库原文引用';body=`<label>搜索资料<input placeholder="书名、关键词或原文"></label><div class="refs"><b>原文片段 · 示例资料</b><p>他以为自己终于赢得了奖品，却发现奖品带来的新麻烦才刚刚开始。</p><small>仅为交互示例，并非《子不语》或其他书籍原文。</small></div><div class="row"><button onclick="addRef('知识库原文片段')">加入本步参考</button><button onclick="addRef('故事来源原文');toast('保留原文和范围；正式开工时才在所选项目创建新集。')">按这段原文拍</button><button onclick="toast('在所选项目内研究候选，不自动创建名为选题研究的项目。')">用这段找灵感</button></div><p>原文、出处、选区范围、项目归属全部保留；浏览和选段不自动建项目。</p>`}
else if(kind==='methods'){title='制作方法与项目方法';body='<p>阶段方法、可选增强、项目方法同步和实际输入记录保留。AI 从当前选择中组织专业工作，不覆盖用户已配置的方法。</p><div class="refs">当前阶段主方法<br>项目角色与系列要求<br>已选增强方法</div><p>正式产品复用现有方法列表与来源，不新增一套平行配置。</p>'}
else if(kind==='decisions'){title='导演决定';body=`<p>${decision?'已登记：保留怪兽装和大鱼尾巴，把两猫配合写得更清楚。':'本示例尚未手动登记决定。'}</p><p>原话、作用范围、查看和撤销入口保留；不恢复采用前逐条确认弹窗。</p>`}
else if(kind==='more'){title='更多工具';body='<div class="row"><button onclick="openPanel(\'references\')">本步需求与参考</button><button onclick="openPanel(\'methods\')">阶段技能</button><button onclick="openPanel(\'division\')">执行与分工</button><button onclick="openPanel(\'logs\')">任务记录</button></div><p>讨论与试写、历史版本、连接设置等既有能力继续保留。</p>'}
else if(kind==='image'){title='原图与候选';body='<div class="image" style="height:330px">图像占位 · 此原型没有生成或替换图片</div><p>正式产品沿用原图放大、候选比较、局部改图和来源查看。</p>'}
else if(kind==='check'){title='过关清单';body='<p>原清单保留，AI 自动处理可修复项。用户可查看检查依据，不必逐项签收。</p><p>引用和文件等确定性检查继续由程序执行，创作与语义由 AI 判断。</p>'}
else if(kind==='source'){title='版本来源';body='<p>保留起草输入、上游版本、原文引用、方法、请求型号和服务商实际回报。自动推进仍记录来源。</p>'}
else if(kind==='logs'){title='执行日志';body='<p>沿用已有等待/执行计时、任务状态、模型回执和错误历史。不伪造完成比例。</p>'}
else if(kind==='home'){title='现有首页保留';body='<p>一句话、项目选择、选题池、风格、知识库原文、附件及规格设置都保留。只增强开工后的 AI 连续执行。</p>'}
else if(kind==='projects'){title='项目与分集保留';body='<p>沿用现有多项目标签、项目归属和历史分集。新设计不迁移或改写已制作内容。</p>'}
else{title='交付页面保留';body='<p>沿用独审、交付核验、H3 出包设置和发布文案页面。AI 完成准备，用户仍可查看图文、调整设置和出包。</p>'}
$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;if(!$('#modal').open)$('#modal').showModal()}
function addRef(s){if(!refs.includes(s))refs.push(s);$('#refCount').textContent=refs.length;toast('示例引用已保留：'+s)}nav();doc();updateModels();
</script></html>
