<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H3 本机项目打包</title>
<style>body{font:16px system-ui;background:#f3f6f8;color:#172d3a;margin:30px auto;max-width:920px;padding:0 20px}section{background:white;border-radius:14px;padding:24px;margin:18px 0}input,select,button{font:inherit;padding:9px;border:1px solid #aabdc5;border-radius:6px}input[type=text]{width:95%}button{cursor:pointer;background:#ddf5ec;margin:8px 8px 8px 0}label{display:block;margin:12px 0}table{width:100%;text-align:left}td{padding:10px 0;border-bottom:1px solid #eee}small{color:#536b78}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{white-space:pre-wrap}button:disabled{opacity:.5;cursor:wait}.asset-gallery{display:flex;flex-wrap:wrap;gap:12px}.asset-preview{border:1px solid #d4e0e5;border-radius:8px;padding:10px;width:220px;overflow-wrap:anywhere}.asset-preview img{width:100%;max-height:220px;object-fit:contain}.grid{display:flex;flex-wrap:wrap;gap:20px}</style>
<h1>H3 本机项目打包</h1><p>读取当前正式文件，生成整集或分段项目包。纯本机处理，无模型调用。</p><button id="close">关闭工具</button>
<section><label>短片结果页的本机路径<input id="path" type="text" placeholder="粘贴 /…/正式交付/00_图文对照.html 或 file:// 路径"></label><button id="read">读取项目</button></section>
<section id="project" hidden><h2 id="title"></h2><pre id="source"></pre><p>结果页用于定位，打包以当前 episode.json 及实际文件为准。</p><button id="all">全选</button><button id="none">全不选</button><table><thead><tr><th>选择</th><th>生成段</th><th>时长</th><th>输入图片／素材</th></tr></thead><tbody id="segments"></tbody></table><p id="assets"></p><div id="gallery" class="asset-gallery"></div>
<div class="grid"><label>输出尺寸<select id="resolution"><option value="default">工作流默认</option><option>480p</option><option>768p</option><option>1080p</option></select></label><label>声音<select id="audio"><option value="true">开启</option><option value="false">关闭</option></select></label><label>候选数<select id="candidates"><option>1</option><option>2</option><option>4</option></select></label><label>实例<select id="instanceType"><option value="default">普通</option><option value="plus">Plus</option><option value="ultra">Ultra</option></select></label><label>种子（空为随机）<input id="seed" type="number" min="0" step="1"></label></div>
<button id="pack">生成并下载项目包</button><small>保存到浏览器下载目录（通常为“下载”）；原图、提示词与清单不会被修改。</small></section><section id="status" role="status">等待选择结果页。</section>
<script>
const token='__TOKEN__',$=id=>document.getElementById(id);let key=null;let busy=false;
async function call(path,data,download=false){if(busy)throw Error('请等待当前操作完成');busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Packager-Token':token},body:JSON.stringify(data)});if(!r.ok)throw Error((await r.json()).error);if(download){const blob=await r.blob(),filename=decodeURIComponent(r.headers.get('Content-Disposition').split("filename*=UTF-8''")[1]);const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return {filename,segments:r.headers.get('X-Package-Segments'),assets:r.headers.get('X-Package-Assets')};}return await r.json();}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function error(e){$('status').textContent=e.message;}
$('read').onclick=async()=>{key=null;$('project').hidden=true;try{const d=await call('/read',{path:$('path').value});key=d.key;$('title').textContent=d.title;$('source').textContent=d.directory+'\n清单指纹：'+d.manifestSha256;$('gallery').replaceChildren();for(const a of d.assets){const card=document.createElement('div');card.className='asset-preview';const title=document.createElement('div');title.textContent=a.id+' · '+(a.fixed?'固定角色':a.origin==='new'?'本集新图':'复用素材');const name=document.createElement('small');name.textContent=a.name;card.append(title,name);if(a.kind==='image'){const button=document.createElement('button');button.textContent='预览原图';button.onclick=async()=>{try{const image=await call('/asset',{key,id:a.id});const img=document.createElement('img');img.src=image.dataUrl;img.alt=a.id;card.append(img);button.remove();}catch(e){error(e);}};card.append(button);}$('gallery').append(card);}$('segments').replaceChildren();for(const s of d.segments){const tr=document.createElement('tr');const td=document.createElement('td'),box=document.createElement('input');box.type='checkbox';box.checked=true;box.value=s.id;box.setAttribute('aria-label','选择第'+s.id+'段');td.append(box);tr.append(td);for(const value of [s.id+' · '+s.name,s.duration+'秒',s.references.join('、')]){const cell=document.createElement('td');cell.textContent=value;tr.append(cell);}$('segments').append(tr);}$('assets').textContent='固定角色图 '+d.assets.filter(a=>a.fixed).length+' 份；其他素材 '+d.assets.filter(a=>!a.fixed).length+' 份。只打包选中段实际引用的素材。';$('project').hidden=false;$('status').textContent='已读取。确认分段和参数后生成项目包。';}catch(e){error(e);}};
$('all').onclick=()=>document.querySelectorAll('#segments input').forEach(b=>b.checked=true);$('none').onclick=()=>document.querySelectorAll('#segments input').forEach(b=>b.checked=false);
$('pack').onclick=async()=>{try{const ids=[...document.querySelectorAll('#segments input:checked')].map(b=>b.value);$('status').textContent='正在检查文件并打包…';const d=await call('/pack',{key,segments:ids,params:{resolution:$('resolution').value,audio:$('audio').value==='true',candidates:Number($('candidates').value),seed:$('seed').value===''?null:Number($('seed').value),instanceType:$('instanceType').value}},true);$('status').textContent='完成：'+d.segments+'段，'+d.assets+'份素材\n'+d.filename+'\n已发起浏览器下载，请在下载列表查看，然后在H3系统手工上传。';}catch(e){error(e);}};
$('close').onclick=async()=>{try{await call('/shutdown',{});$('status').textContent='工具已关闭，可以关闭此浏览器页面。';document.querySelectorAll('button').forEach(b=>b.disabled=true);}catch(e){error(e);}};
</script></html>
